name: OCI Conformance Tests

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

jobs:
  conformance-test:
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: |
            test/target.Dockerfile
            Makefile

      # run make testfs to replicate a testfs
      - name: make test filesystem
        env:
          TEST_DIR: ${{ github.workspace }}/_testfs
        run: |
          mkdir fs && make testfs && mv $TEST_DIR/* fs

      # run make testcert to replicate proper certs
      - name: Generate TLS certificates
        env:
          CERT_DIR: ${{ github.workspace }}/testcert
        run: |
          mkdir certs && make testcert && mv $CERT_DIR/* certs

      - name: clean unneeded files
        run: |
          rm -rf Makefile test/target.Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start registry
        run: |
          docker run -d --name registry \
            --mount type=bind,source=${{ github.workspace }},target=/data \
            -e FS_ROOT=/data/fs \
            -e HTTP_TLS_CERT_FILE_PATH=/data/certs/server.crt \
            -e HTTP_TLS_KEY_FILE_PATH=/data/certs/server.key \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}

      # Wait for registry to be up
      - name: Wait for the registry to be up
        run: |
          for i in {1..10}; do
            if curl -sf --cacert ${{ github.workspace }}/certs/ca.crt https://localhost:5000/v2/; then
              echo "Registry is up!"
              exit 0
            fi
            sleep 2
          done
          echo "Registry did not start in time." >&2
          exit 1

      # Compute digests to skip the Pull Setup phase (which requires push).
      # Setting OCI_TAG_NAME + OCI_MANIFEST_DIGEST + OCI_BLOB_DIGEST tells the
      # conformance tool to use existing content instead of pushing its own.
      - name: Compute manifest and blob digests for Pull tests
        run: |
          MANIFEST_PATH=${{ github.workspace }}/fs/my-solution/v4.5.0/docker.io/library/alpine/3.22/manifest.json
          MANIFEST_DIGEST="sha256:$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')"
          BLOB_DIGEST=$(jq -r '.config.digest' "$MANIFEST_PATH")
          echo "OCI_MANIFEST_DIGEST=$MANIFEST_DIGEST" >> "$GITHUB_ENV"
          echo "OCI_BLOB_DIGEST=$BLOB_DIGEST" >> "$GITHUB_ENV"

      # Run the conformance container directly to control --network host,
      # since the v1.0 action uses docker but doesn't expose that flag.
      - name: Run OCI Distribution Spec conformance test suite
        continue-on-error: true # blob HEAD/GET specs fail until /v2/<name>/blobs/<digest> is implemented
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/conformance-results
          docker run --rm --network host \
            -v ${{ github.workspace }}/artifacts/conformance-results:/results \
            -v ${{ github.workspace }}/certs/ca.crt:/etc/ssl/certs/ca-certificates.crt \
            -w /results \
            -e OCI_ROOT_URL=https://localhost:5000 \
            -e OCI_NAMESPACE=docker.io/library/alpine \
            -e OCI_TEST_PULL=1 \
            -e OCI_TEST_PUSH=0 \
            -e OCI_TEST_CONTENT_DISCOVERY=1 \
            -e OCI_TEST_CONTENT_MANAGEMENT=0 \
            -e OCI_HIDE_SKIPPED_WORKFLOWS=1 \
            -e OCI_DEBUG=0 \
            -e OCI_DELETE_MANIFEST_BEFORE_BLOBS=0 \
            -e OCI_TAG_LIST="3.19,3.20,3.21,3.22" \
            -e OCI_TAG_NAME="3.22" \
            -e OCI_MANIFEST_DIGEST="$OCI_MANIFEST_DIGEST" \
            -e OCI_BLOB_DIGEST="$OCI_BLOB_DIGEST" \
            ghcr.io/opencontainers/distribution-spec/conformance:v1.0.0-rc2@sha256:2f0ced454ce31793cc69d48a05233ea76f2ebe791936d053342b66388a6de260

      - name: Upload conformance results
        if: always()
        uses: scality/action-artifacts@v4
        with:
          method: upload
          url: https://artifacts.scality.net
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: ${{ github.workspace }}/artifacts/
