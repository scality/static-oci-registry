name: OCI Conformance Tests

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

jobs:
  conformance-test:
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test/target.Dockerfile
            Makefile

      # run make testfs to replicate a testfs
      - name: make test filesystem
        env:
          TEST_DIR: ${{ github.workspace }}/_testfs
        run: |
          mkdir fs && make testfs && mv $TEST_DIR/* fs

      - name: clean unneeded files
        run: |
          rm -rf Makefile test/target.Dockerfile

      - name: Generate TLS certificates
        run: |
          mkdir -p certs
          openssl genrsa -out certs/ca.key 4096 2>/dev/null
          openssl req -new -x509 -days 3650 -key certs/ca.key \
            -subj "/CN=static-oci-registry-test-ca" \
            -out certs/ca.crt 2>/dev/null
          openssl genrsa -out certs/server.key 4096 2>/dev/null
          openssl req -new -key certs/server.key \
            -subj "/CN=localhost" \
            -out certs/server.csr 2>/dev/null
          openssl x509 -req -days 3650 -in certs/server.csr \
            -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1") \
            -out certs/server.crt 2>/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start registry
        run: |
          docker run -d --name registry \
            --mount type=bind,source=${{ github.workspace }},target=/data \
            -e FS_ROOT=/data/fs \
            -e HTTP_TLS_CERT_FILE_PATH=/data/certs/server.crt \
            -e HTTP_TLS_KEY_FILE_PATH=/data/certs/server.key \
            -p 5000:5000 \
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}

      # Wait for registry to be up
      - name: Wait for the registry to be up
        run: |
          for i in {1..10}; do
            if curl -sf --cacert ${{ github.workspace }}/certs/ca.crt https://localhost:5000/v2/; then
              echo "Registry is up!"
              exit 0
            fi
            sleep 2
          done
          echo "Registry did not start in time." >&2
          exit 1

      # Run the conformance container directly to control --network host,
      # since the v1.0 action uses docker but doesn't expose that flag.
      - name: Run OCI Distribution Spec conformance test suite
        # continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/conformance-results
          docker run --rm --network host \
            -v ${{ github.workspace }}/conformance-results:/results \
            -v ${{ github.workspace }}/certs/ca.crt:/etc/ssl/certs/ca-certificates.crt \
            -w /results \
            -e OCI_ROOT_URL=https://localhost:5000 \
            -e OCI_NAMESPACE=docker.io/library/alpine \
            -e OCI_TEST_PULL=0 \
            -e OCI_TEST_PUSH=0 \
            -e OCI_TEST_CONTENT_DISCOVERY=1 \
            -e OCI_TEST_CONTENT_MANAGEMENT=0 \
            -e OCI_HIDE_SKIPPED_WORKFLOWS=1 \
            -e OCI_DEBUG=0 \
            -e OCI_DELETE_MANIFEST_BEFORE_BLOBS=0 \
            -e OCI_TAG_LIST="3.19,3.20,3.21,3.22" \
            ghcr.io/opencontainers/distribution-spec/conformance:v1.0.0-rc2@sha256:2f0ced454ce31793cc69d48a05233ea76f2ebe791936d053342b66388a6de260

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-distribution-spec-conformance-results
          path: |
            ${{ github.workspace }}/conformance-results/report.html
            ${{ github.workspace }}/conformance-results/junit.xml
