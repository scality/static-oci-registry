name: Kube tests

on:
  workflow_call:

env:
  ENVTEST_K8S_VERSION: 1.34.x!
  ENVTEST_RELEASE: release-0.22

jobs:
  kube-test:
    name: Run on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: clone the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set up go
        uses: ./.github/actions/setup-go
      - name: Cache envtest binaries
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: kubebuilder-envtest-${{ runner.os }}-${{ env.ENVTEST_K8S_VERSION }}
      - name: Install setup-envtest and resolve KUBEBUILDER_ASSETS
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@${ENVTEST_RELEASE}
          KUBEBUILDER_ASSETS=$(setup-envtest use -p path ${ENVTEST_K8S_VERSION})
          echo "KUBEBUILDER_ASSETS=${KUBEBUILDER_ASSETS}" >> "${GITHUB_ENV}"
      - name: Run Tests
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/kube-results
          make kube-test JUNIT_REPORT_DIR=${{ github.workspace }}/artifacts/kube-results
      - name: Generate HTML report
        if: always()
        run: |
          python3 -m pip install junit2html --quiet
          junit2html \
            ${{ github.workspace }}/artifacts/kube-results/junit-kube.xml \
            ${{ github.workspace }}/artifacts/kube-results/report.html
      - name: Upload test results
        if: always()
        uses: scality/action-artifacts@b311c0a0d8017683148906bd3fbe0e681b115608 # 4.3.0
        with:
          method: upload
          url: https://artifacts.scality.net
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: ${{ github.workspace }}/artifacts/
