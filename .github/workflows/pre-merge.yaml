name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: true
      is-latest: false
      is-stable: false

  go-generate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install mockery
        env:
          # renovate: datasource=github-releases depName=vektra/mockery
          MOCKERY_VERSION: v3.8.1
        run: go install github.com/vektra/mockery/v3@${{ env.MOCKERY_VERSION }}
      - name: Ensure go generate as been run if needed
        # We run go generate and then check if there are any changes
        run: |
          go generate ./... &&
          git diff --quiet

  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test-unit:
    uses: ./.github/workflows/test-unit.yaml
    secrets: inherit

  test-integration:
    uses: ./.github/workflows/test-integration.yaml
    secrets: inherit

  test-conformance:
    needs: build
    uses: ./.github/workflows/test-conformance.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}

  test-e2e:
    needs: build
    uses: ./.github/workflows/test-e2e.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}

  test-kube:
    uses: ./.github/workflows/test-kube.yaml
    secrets: inherit

  pre-merge:
    name: Pre Merge
    # Single check for rulesets to require: GitHub reports one check per job, never one per workflow
    # always(): a job skipped because a dependency failed reports success and would let the PR merge
    if: always()
    needs:
      - build
      - go-generate
      - lint
      - test-unit
      - test-integration
      - test-conformance
      - test-e2e
      - test-kube
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if a pre-merge job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
