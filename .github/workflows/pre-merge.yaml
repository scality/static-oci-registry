name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.24"

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: true
      is-latest: false
      is-stable: false

  go-generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install mockery
        env:
          # renovate: datasource=github-releases depName=vektra/mockery
          MOCKERY_VERSION: v3.7.1
        run: go install github.com/vektra/mockery/v3@${{ env.MOCKERY_VERSION }}
      - name: Ensure go generate as been run if needed
        # We run go generate and then check if there are any changes
        run: |
          go generate ./... &&
          git diff --quiet

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test-unit:
    uses: ./.github/workflows/test-unit.yaml
    secrets: inherit

  test-integration:
    uses: ./.github/workflows/test-integration.yaml
    secrets: inherit

  test-conformance:
    needs: build
    uses: ./.github/workflows/test-conformance.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}

  test-e2e:
    needs: build
    uses: ./.github/workflows/test-e2e.yaml
    secrets: inherit
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
