name: Unit Tests

on:
  workflow_call:

jobs:
  unit-test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@v6
      - name: set up go
        uses: ./.github/actions/setup-go
      - name: Run Tests
        run: |
          make unit-test
